<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المحاشي - لقمة هنية</title>
    <style>
        body { font-family: sans-serif; background-color: #fdf2e9; text-align: center; padding: 20px; }
        .food-item { background: white; margin-bottom: 20px; padding: 15px; border-radius: 15px; border: 1px solid #e67e22; }
        .food-item img { width: 100%; max-width: 300px; border-radius: 10px; height: 200px; object-fit: cover; }
        .price { color: #27ae60; font-weight: bold; font-size: 1.2em; display: block; margin-top: 10px; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 12px 25px; background: #5d4037; color: white; text-decoration: none; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🍲 مشكل محاشي بيتي</h1>
    
    <div class="food-item">
        <img src="https://kitchen.sayidaty.net/uploads/small/60/6045d94726615b69c898c6928e078978_1235.jpg" alt="ورق عنب">
        <h3>ورق عنب بالليمون</h3>
        <p>خلطة لقمة هنية السرية بالزيت والليمون</p>
        <span class="price">السعر: ٦٠ جنيه (طبق)</span>
    </div>

    <div class="food-item">
        <img src="https://www.supermama.me/system/resources/W1siZiIsIjIwMTYvMTIvMTEvMTEvMzgvNTcvNzc1L21haGFzaGkuanBnIl1d/mahashi.jpg" alt="محشي مشكل">
        <h3>طبق مشكل (كرنب، كوسة، فلفل)</h3>
        <p>تشكيلة محاشي ساخنة تسوية بيتي</p>
        <span class="price">السعر: ٨٠ جنيه</span>
    </div>

    <a href="index.html" class="back-btn">🔙 العودة للمنيو الرئيسي</a>
</body>
</html>
