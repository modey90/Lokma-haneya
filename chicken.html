<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الفراخ - لقمة هنية</title>
    <style>
        body { font-family: sans-serif; background-color: #fdf2e9; text-align: center; padding: 20px; }
        .food-item { background: white; margin-bottom: 20px; padding: 15px; border-radius: 15px; border: 1px solid #e67e22; shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .food-item img { width: 100%; max-width: 300px; border-radius: 10px; }
        .price { color: #27ae60; font-weight: bold; font-size: 1.2em; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px; background: #5d4037; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🍗 منيو الفراخ والطيور</h1>
    
    <div class="food-item">
        <img src="رابط_صورة_الفرخة_هنا" alt="فرخة مشوية">
        <h3>فرخة مشوية كاملة</h3>
        <p>مع أرز بسمتي وسلطات</p>
        <p class="price">السعر: ٢٣٠ ج</p>
    </div>

    <div class="food-item">
        <img src="رابط_صورة_البانية_هنا" alt="وجبة بانية">
        <h3>وجبة بانية عائلي</h3>
        <p>كيلو بانية + مكرونة</p>
        <p class="price">السعر: ٣٥٠ ج</p>
    </div>

    <a href="index.html" class="back-btn">العودة للمنيو الرئيسي</a>
</body>
</html>
