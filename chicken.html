<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو الفراخ - لقمة هنية</title>
    <style>
        body { font-family: sans-serif; background-color: #fdf2e9; text-align: center; padding: 20px; }
        .food-item { background: white; margin-bottom: 20px; padding: 15px; border-radius: 15px; border: 1px solid #e67e22; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .food-item img { width: 100%; max-width: 300px; border-radius: 10px; height: 200px; object-fit: cover; }
        .price { color: #27ae60; font-weight: bold; font-size: 1.5em; display: block; margin-top: 10px; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 12px 25px; background: #5d4037; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .offer-badge { background: #e74c3c; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>🍗 منيو الفراخ والطيور</h1>

    <div class="food-item" style="border: 3px solid #e74c3c;">
        <div class="offer-badge">🔥 عرض لقمة هنية الموفر</div>
        <img src="https://images.unsplash.com/photo-1562967914-608f82629710?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60" alt="وجبة بانية ومكرونة">
        <h3>وجبة مكرونة وبانية متكاملة</h3>
        <p>مكرونة + قطعة بانية مقرمشة + سلطة خضراء + رغيف عيش + معلقة</p>
        <span class="price">السعر: ٣٠ جنيه فقط</span>
    </div>
    
    <div class="food-item">
        <img src="https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60" alt="فرخة مشوية">
        <h3>فرخة مشوية على الفحم</h3>
        <p>مع أرز بسمتي، سلطة طحينة، وسلطة خضراء</p>
        <span class="price">السعر: ٢٣٠ جنيه</span>
    </div>

    <a href="index.html" class="back-btn">🔙 العودة للمنيو الرئيسي</a>
</body>
</html>
